<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversational Chatbot — Educational Assistant</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <span class="status-indicator">● ONLINE</span>
                <h1 class="app-title">Educational Conversational Chatbot</h1>
            </div>
            <p class="app-subtitle">Intelligent multi-domain assistant for Programming, Web Dev, SQL &amp; CS Fundamentals</p>
        </header>
        <main class="chat-window" id="chatWindow">
            <!-- Welcome message will be inserted by JavaScript on load -->
        </main>
        <section class="suggestions" id="suggestions">
            <p class="suggestion-title">Try asking about:</p>
            <div class="suggestion-buttons">
                <button class="suggest-btn" data-question="What is Python?">Python</button>
                <button class="suggest-btn" data-question="Explain list comprehension">List Comprehension</button>
                <button class="suggest-btn" data-question="Explain OOP">OOP Pillars</button>
                <button class="suggest-btn" data-question="What is HTML?">HTML</button>
                <button class="suggest-btn" data-question="What is CSS Flexbox?">CSS Flexbox</button>
                <button class="suggest-btn" data-question="Difference between let and var">JS let vs var</button>
                <button class="suggest-btn" data-question="What is a Primary Key?">SQL Primary Key</button>
                <button class="suggest-btn" data-question="What is an Algorithm?">Algorithm</button>
                <button class="suggest-btn" data-question="What is DNS?">DNS</button>
                <button class="suggest-btn" data-question="How does this chatbot work?">How Chatbot Works</button>
            </div>
        </section>
        <footer class="input-area">
            <input type="text" id="userInput" placeholder="Ask a question about Python, HTML, CSS, JS, SQL, CS..." autocomplete="off" />
            <button id="sendBtn" class="action-btn">Send</button>
            <button id="clearBtn" class="action-btn clear-btn">Clear Chat</button>
        </footer>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
